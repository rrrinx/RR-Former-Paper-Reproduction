device: &device 'cuda'
seed: 42
days: &days 7
seg: 0
res_path: './res'

data:
  path: './dataset/processed_data'
  split:
    begin: '1989-10-01'
    train_end: '2008-9-30'
    val_end: '2001-9-30'
    test_end: '1999-9-31'
  seq_len: &seq_len 22
  tar_len: *days
  batch_size: 512
  d_features: &d_features 32
  num_workers: 0

model:
  d_model: 64
  d_features: *d_features
  n_head: 4
  dropout: 0.1
  n_layers: 4
  d_hidden: 256
  seq_len: *seq_len
  tar_len: *days


train:
  learning_rate: 1e-3
  weight_decay: 0.0
  patience: 100
  epochs: 100
  days: *days
  device: *device
  save_dir: './pt'

img:
  save_dir: './img'

execution_target: [['01', '01013500']]
# [['03','02246000'], ['03', '02381600'], ['04', '04015330'], ['05', '03049800'], ['15','09505200'], ['07', '05507600'], ['10', '06344600']]
